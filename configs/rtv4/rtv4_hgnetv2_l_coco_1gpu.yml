__include__: [
  './rtv4_hgnetv2_l_coco.yml'
]

# Single-GPU (RTX 3090 24GB) training config.
# Official recipe: 4 GPUs x 8 = total batch 32.
# Here: total batch 8, LR scaled linearly (x 8/32 = 1/4).
# Launch with: python train.py -c configs/rtv4/rtv4_hgnetv2_l_coco_1gpu.yml --use-amp --seed=0 -t weights/rtv4_hgnetv2_l_coco.pth

output_dir: ./outputs/rtv4_hgnetv2_l_coco_1gpu

train_dataloader:
  total_batch_size: 32
  num_workers: 4

val_dataloader:
  total_batch_size: 32
  num_workers: 4

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00000625
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.000125
  betas: [0.9, 0.999]
  weight_decay: 0.000125
