__include__: [
  '../dfine/dfine_hgnetv2_l_coco.yml',
  '../base/rtv4.yml'
]

output_dir: ./outputs/rtv4_hgnetv2_l_coco

# Inference-only config: teacher_model removed (only needed for distillation training).
# The student checkpoint does not contain teacher weights.

HybridEncoder:
  distill_teacher_dim: 768

RTv4Criterion:
  weight_dict:
    loss_distill: 15.0
  distill_adaptive_params:
    enabled: True
    rho: 2
    delta: 0.1
    default_weight: 15

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.000025
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0005
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epoches: 58

flat_epoch: 29
no_aug_epoch: 8

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: [4, 29, 50]

  collate_fn:
    mixup_epochs: [4, 29]
    stop_epoch: 50
